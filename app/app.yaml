command:
  - streamlit
  - run
  - app.py

env:
  - name: MLFLOW_EXPERIMENT_NAME
    value: "/Shared/genie-agent-workshop"
  - name: GENIE_AGENT_ID
    value: "01f19b1817411d1fbd9614d6d45562b5"
  # - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    # value: "9bbc027402111984"
  - name: ANALYZER_MODEL
    value: databricks-claude-sonnet-5
  # Lakebase endpoint backing the code_grounded scorer's BM25 code index.
  # PGHOST/PGPORT/PGDATABASE/PGUSER are auto-injected by the platform from the
  # `postgres` app resource; only the endpoint path must be set explicitly.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_WORKSPACE_URL
    value: "https://fevm-serverless-stable-h911sx.cloud.databricks.com"
  - name: DATABRICKS_WORKSPACE_ID
    value: "7474645500368791"
