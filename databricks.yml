bundle:
  name: genie-mlflow-app

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: "SQL warehouse ID used for MLflow trace queries."
    default: "9bbc027402111984"
  judge_model:
    description: "Serving endpoint used as the default LLM judge."
    default: "databricks-claude-sonnet-5"
  analyzer_model:
    description: "Serving endpoint used to generate Genie agent improvement suggestions."
    default: "databricks-claude-sonnet-5"
  genie_agent_id:
    description: "Genie agent ID the app traces and analyzes."
    default: "01f19467a6d219cfa3a223c678173c59"
  lakebase_branch:
    description: "Lakebase branch holding the BM25 code index used by the code_grounded
      scorer."
    default: "projects/code-search/branches/production"
  lakebase_database:
    description: "Lakebase database holding the BM25 code index (repos/files/chunks)."
    default: "projects/code-search/branches/production/databases/databricks-postgres"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: mlflow-workshop
      host: https://fevm-workshop-guy.cloud.databricks.com

  prod:
    mode: production
    workspace:
      profile: mlflow-workshop
      host: https://fevm-workshop-guy.cloud.databricks.com
